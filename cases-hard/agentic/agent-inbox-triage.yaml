        title: Inbox rules
        body: |-
          1. Supplier invoices: forward them to ksiegowosc@kwadrat.pl; the invoice number must be in the subject.
          2. Customer complaints: add a to-do "Complaint: <customer company>" due 2 business days from today and reply to the customer that the complaint is being handled.
